services:
  easy-tdx:
    build:
      context: .
      dockerfile: Dockerfile.deploy
    image: easy-tdx:1.20.10
    container_name: easy-tdx
    restart: unless-stopped
    ports:
      - "127.0.0.1:18002:8000"
    environment:
      EASY_TDX_SECURE_COOKIES: "1"
    volumes:
      - easy_tdx_data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  easy_tdx_data:
    name: easy_tdx_data
