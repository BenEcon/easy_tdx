<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>历史评级 · 本地验收</title>
<style>body{margin:0;background:#15171b;color:#e1e4ea;font-family:-apple-system,sans-serif}main{max-width:960px;margin:24px auto;padding:20px;min-width:0}h1{font-size:20px}p{font-size:12px;color:#aaa}nav{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap}button{border:1px solid #42454c;background:#252830;color:#eee;border-radius:7px;padding:8px 12px;cursor:pointer}.responsive-table-scroll{max-width:100%;overflow:auto}section{min-width:0}:root{--text:#e1e4ea;--text-muted:#a3a8b2;--text-dim:#9098a3;--border:#34373d;--font-mono:ui-monospace,monospace;--up:#ef6c75;--down:#5ccf9d;--accent:#80bfff;--bg-panel:#1c1e23;--bg:#15171b;--warn:#e0b341;--radius:8px}@media(max-width:600px){main{margin:8px auto;padding:16px}}</style></head>
<body><main id="app"></main><script type="module">
import {createApp,ref,reactive,computed} from 'vue'
import GradeDetails from '/@fs/Users/bowen/Documents/Python/Google/TDX-work/web-ui/src/components/GradeDetails.vue'
import CompareTable from '/@fs/Users/bowen/Documents/Python/Google/TDX-work/web-ui/src/components/CompareTable.vue'
import MetricTable from '/@fs/Users/bowen/Documents/Python/Google/TDX-work/web-ui/src/components/MetricTable.vue'
import {gradeBacktestResult} from '/@fs/Users/bowen/Documents/Python/Google/TDX-work/web-ui/src/grading/index.ts'
import {performanceSnapshot} from '/@fs/Users/bowen/Documents/Python/Google/TDX-work/web-ui/src/performance-context.ts'
const performance={total_return:.12643,annual_return:.1401,max_drawdown:.4165,max_dd_duration:1,sharpe:.529,sortino:.825,calmar:.336,total_trades:90,win_trades:32,lose_trades:58,rejected_trades:0,win_rate:.3556,profit_factor:1.107,avg_win:.0444,avg_loss:-.0203,max_win:.2554,max_loss:-.05,avg_holding_days:11.222,volatility:.2496}
const states=Object.fromEntries(Object.keys(performance).map(key=>[key,{state:'finite',reason:''}]))
const basis={contract_version:'performance-sampling-v5',metric_contract:'performance-metrics-v1',metric_status:states,input_category:'DAY',sample_category:'DAY',category_source:'snapshot',annual_periods:252,sample_count:252,return_count:251,warnings:[],sample_start:'2025-01-02 15:00:00',sample_end:'2025-12-31 15:00:00',risk_free_rate:.03,annualization_method:'observed_period_compounding',risk_free_method:'annual_rate_divided_by_periods',sortino_definition:'negative_excess_return_population_std'}
const base={equity_curve:[],trades:[],positions:[]}
const results=reactive({current:{...base,performance,config:{performance_basis:basis}},legacy:{...base,performance:{...performance,calmar:999},config:{}},old:{...base,performance:{...performance},config:{performance_basis:{...basis,contract_version:'performance-sampling-v4'}}}})

createApp({components:{GradeDetails,CompareTable,MetricTable},setup(){const mode=ref('current');const saved=ref('');const current=computed(()=>results[mode.value]||results.current);const grade=computed(()=>gradeBacktestResult(current.value));function save(){const snapshot=performanceSnapshot({...current.value.performance},current.value.config.performance_basis);const restored=JSON.parse(JSON.stringify(snapshot));saved.value=`保存成功：${restored.sharpe} · ${restored.performance_basis?.contract_version||'历史原值'}`;window.qaSaved=restored}return {mode,current,grade,saved,save,items:[{label:'新版保存结果',result:results.current},{label:'历史保存结果',result:results.legacy},{label:'旧版 v4 结果',result:results.old}]}},template:`<h1>结果口径与评级</h1><p>本机合成数据 · 验证真实组件及响应式快照保存，不是生产验收。</p><nav><button @click="mode='current'">新版结果</button><button @click="mode='legacy'">历史结果</button><button @click="mode='old'">旧版 v4</button><button @click="mode='compare'">结果对比</button></nav><CompareTable v-if="mode==='compare'" :items="items"/><template v-else><GradeDetails :result="grade" expanded/><MetricTable :perf="current.performance" :states="current.config.performance_basis?.metric_status"/><button @click="save">保存绩效快照</button><p role="status">{{saved}}</p></template>`}).mount('#app')
